  const a=$('#pin1').value,b=$('#pin2').value;
  if(!/^\d{4,6}$/.test(a))return toast('El PIN debe tener de 4 a 6 números.');
  if(a!==b)return toast('Los PIN no coinciden.');
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem(PINKEY,JSON.stringify({salt,hash:await pinHash(a,salt),len:a.length,bio:old&&old.bio||null}));
  closeSheet();render();toast('PIN guardado');
}
async function removePin(){
  const p=prompt('Escribe tu PIN actual para quitarlo:');
  if(p===null)return;
  if(!(await pinOk(p)))return toast('El PIN no es correcto.');
  localStorage.removeItem(PINKEY);render();toast('PIN quitado');
}
function forgotPin(){
  if(!confirm('Para restablecer el PIN debes cerrar sesión y volver a entrar con Google. Tus datos siguen guardados en tu cuenta. ¿Continuar?'))return;
  signOut(true);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')hiddenAt=Date.now();
  else if(pinCfg()&&!locked&&hiddenAt&&Date.now()-hiddenAt>30000)showLock();
});

/* ---------- datos de ejemplo ---------- */
function loadDemo(){
  let seed=7;const rnd=(a,b)=>{seed=(seed*9301+49297)%233280;return round2(a+(seed/233280)*(b-a))};
  const y=S.year,today=todayStr();const lastM=y<new Date().getFullYear()?11:y>new Date().getFullYear()?-1:new Date().getMonth();
  const ids=k=>(S.wallets.find(w=>w.type===k)||{}).id;
  const bank=ids('banco'),cash=ids('efectivo'),save=ids('ahorro'),card=ids('credito'),inv=ids('inversion');
  const gema=(S.wallets.find(w=>w.scope==='GemaVinyl')||{}).id||bank,str=(S.wallets.find(w=>w.scope==='StreamingPlus02')||{}).id||bank;
  const add=(date,type,amount,wallet,o={})=>{if(date>today||!wallet)return;S.tx.push(Object.assign({id:uid(),type,amount:round2(amount),date,wallet,created:Date.now(),demo:true},o))};
  for(let m=0;m<=lastM;m++){
    add(ymd(y,m,15),'ingreso',1150,bank,{category:'Sueldo',scope:'Personal',note:'Sueldo IASA'});
    add(ymd(y,m,28),'ingreso',rnd(250,480),bank,{category:'Incentivos',scope:'Personal',note:'Incentivos IASA'});
    for(let k=0;k<3;k++)add(ymd(y,m,4+k*8),'ingreso',rnd(25,95),gema,{category:'Ventas',scope:'GemaVinyl',note:['Tazas personalizadas','Camisetas sublimadas','Cuadro','Jarros'][k%4]});
    add(ymd(y,m,6),'gasto',rnd(45,110),gema,{category:'Insumos GemaVinyl',scope:'GemaVinyl',note:'Papel y tinta de sublimación'});
    add(ymd(y,m,3),'ingreso',rnd(95,150),str,{category:'Ventas',scope:'StreamingPlus02',note:'Renovaciones de clientes'});
    add(ymd(y,m,5),'gasto',rnd(55,85),str,{category:'Costo cuentas streaming',scope:'StreamingPlus02',note:'Recarga de cuentas'});
    add(ymd(y,m,7),'gasto',rnd(22,34),bank,{category:'Luz',scope:'Personal'});
    add(ymd(y,m,7),'gasto',rnd(9,15),bank,{category:'Agua',scope:'Personal'});
    add(ymd(y,m,10),'gasto',40,bank,{category:'Internet',scope:'Personal'});
    add(ymd(y,m,12),'gasto',rnd(40,120),cash,{category:'Transporte / Combustible',scope:'Personal'});
    for(let k=0;k<3;k++)add(ymd(y,m,3+k*9),'gasto',rnd(45,95),card,{category:'Alimentación / Supermercado',scope:'Personal',note:'Supermercado'});
    add(ymd(y,m,20),'gasto',rnd(15,70),card,{category:'Entretenimiento',scope:'Personal'});
    if(m%3===1)add(ymd(y,m,22),'gasto',rnd(30,90),card,{category:'Compras / Ropa',scope:'Personal'});
    add(ymd(y,m,17),'transfer',150,bank,{to:save,note:'Ahorro del mes'});
    if(m%2===0)add(ymd(y,m,18),'transfer',rnd(200,400),save,{to:inv,note:'Aporte a inversiones'});
    add(ymd(y,m,9),'transfer',120,bank,{to:cash,note:'Retiro de cajero'});
  }
  const bw=W(bank),sw=W(save),iw=W(inv);if(bw&&!bw.initial)bw.initial=900;if(sw&&!sw.initial)sw.initial=3000;if(iw&&!iw.initial)iw.initial=2000;
  const cw=W(card);
  if(cw){for(const s of statements(cw)){if(s.opening||!s.due||s.cons<=0)continue;const pd=s.due;if(pd<=today)add(pd,'transfer',s.cons,bank,{to:card,note:'Pago corte de '+MESES[s.m].toLowerCase()})}}
  commit();toast('Datos de ejemplo cargados');
}

/* ---------- eventos ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'nav':closeSheet();go(d.v);break;
    case 'more':openMore();break;
    case 'close':closeSheet();break;
    case 'goMonth':UI.month=+d.m;go('mes');break;
    case 'mPrev':if(UI.month===0){UI.month=11;S.year--;commit(true)}else UI.month--;render();break;
    case 'mNext':if(UI.month===11){UI.month=0;S.year++;commit(true)}else UI.month++;render();break;
    case 'newTx':openTx(null);break;
    case 'editTx':openTx(S.tx.find(t=>t.id===d.id));break;
    case 'txType':readTx();TX.type=d.v;if(d.v==='transfer'&&(!TX.to||TX.to===TX.wallet)){const o=S.wallets.find(w=>w.id!==TX.wallet);TX.to=o?o.id:''}if(d.v!=='transfer'&&!S.cats[d.v==='ingreso'?'ingreso':'gasto'].includes(TX.category))TX.category='';drawTx(!!TX.id);break;
    case 'saveTx':saveTx();break;
    case 'delTx':if(confirm('¿Eliminar este movimiento?')){S.tx=S.tx.filter(t=>t.id!==TX.id);closeSheet();commit();toast('Movimiento eliminado')}break;
    case 'payCard':{const c=W(d.id);const s=cardSummary(c);const amt=d.amt?+d.amt:(s.next?s.next.pend:s.debt);const from=(S.wallets.find(w=>w.type==='banco')||S.wallets.find(w=>w.type!=='credito')||{}).id;
      openTx(null,{type:'transfer',wallet:from,to:c.id,amount:amt?round2(amt):'',note:s.next&&!s.next.opening?'Pago corte de '+MESES[s.next.m].toLowerCase():'Pago de tarjeta'});break;}
    case 'transferFrom':openTx(null,{type:'transfer',wallet:d.id,to:''});break;
    case 'walletTx':UI.wallet=d.id;UI.scope='all';go('mes');break;
    case 'newWallet':openWallet(null,d.type);break;
    case 'editWallet':openWallet(W(d.id));break;
    case 'wColor':readWallet();WED.color=d.v;drawWallet();break;
    case 'saveWallet':{readWallet();const w=WED;if(!w.name)return toast('Ponle un nombre a la billetera.');
      if(w.type!=='negocio')delete w.scope;
      if(!w.id){w.id='w-'+uid();S.wallets.push(w)}else{const i=S.wallets.findIndex(x=>x.id===w.id);S.wallets[i]=w}
      closeSheet();commit();toast('Billetera guardada');break;}
    case 'delWallet':{const used=S.tx.some(t=>t.wallet===WED.id||t.to===WED.id);
      if(used)return toast('Esta billetera tiene movimientos. Elimínalos o muévelos antes de borrarla.');
      if(confirm('¿Eliminar la billetera «'+WED.name+'»?')){S.wallets=S.wallets.filter(w=>w.id!==WED.id);if(UI.wallet===WED.id)UI.wallet='all';closeSheet();commit();toast('Billetera eliminada')}break;}
    case 'newItem':openItem(d.k,null);break;
    case 'editItem':openItem(d.k,S[d.k].find(x=>x.id===d.id));break;
    case 'saveItem':{const it=ITEM.it;it.name=$('#iName').value.trim();it.cat=$('#iCat').value.trim();it.value=parseAmt($('#iVal').value);
      if(!it.name)return toast('Escribe el concepto.');if(!isFinite(it.value))return toast('Escribe un valor.');
      if(!it.id){it.id=uid();S[ITEM.k].push(it)}else{const i=S[ITEM.k].findIndex(x=>x.id===it.id);S[ITEM.k][i]=it}closeSheet();commit();break;}
    case 'delItem':if(confirm('¿Eliminar «'+ITEM.it.name+'»?')){S[ITEM.k]=S[ITEM.k].filter(x=>x.id!==ITEM.it.id);closeSheet();commit()}break;
    case 'pickBiz':UI.biz=d.v;render();break;
    case 'addCat':{const inp=$('#newCat-'+d.k);const v=inp.value.trim();if(!v)return;if(S.cats[d.k].includes(v))return toast('Esa categoría ya existe.');S.cats[d.k].push(v);commit();break;}
    case 'delCat':{const nm=S.cats[d.k][+d.i];if(confirm('¿Quitar la categoría «'+nm+'» de la lista?\n\nLos movimientos que ya la usan no se borran; solo deja de aparecer para elegirla.')){S.cats[d.k].splice(+d.i,1);commit();toast('Categoría quitada')}break;}
    case 'addScope':{const v=$('#newScope').value.trim();if(!v)return;if(S.scopes.find(s=>s.name.toLowerCase()===v.toLowerCase()))return toast('Ese ámbito ya existe.');S.scopes.push({name:v,biz:true});commit();break;}
    case 'delScope':{const s=S.scopes[+d.i];if(S.tx.some(t=>scopeOf(t)===s.name))return toast('Hay movimientos asignados a «'+s.name+'». Cámbialos antes de quitarlo.');if(confirm('¿Quitar el ámbito «'+s.name+'»?')){S.scopes.splice(+d.i,1);commit();toast('Ámbito quitado')}break;}
    case 'exportJson':download('gemafinanzy-respaldo-'+todayStr()+'.json',JSON.stringify(S,null,1));break;
    case 'exportCsv':download('movimientos-'+S.year+'.csv',csv());break;
    case 'importJson':$('#importFile').click();break;
    case 'importCsv':$('#importCsvFile').click();break;
    case 'syncNow':startSession().then(()=>{render();toast(store.mode==='cloud'?'Sincronizado':'No se pudo sincronizar ahora')});break;
    case 'signOut':signOut();break;
    case 'tplXlsx':downloadBlob('GemaFinanzy-plantilla-movimientos.xlsx',buildTemplate());toast('Plantilla descargada');break;
    case 'quick':openQuick();break;
    case 'qGo':quickGo();break;
    case 'qMic':quickMic();break;
    case 'pinNew':openPinSetup();break;
    case 'savePin':savePin();break;
    case 'pinRemove':removePin();break;
    case 'bioOn':enableBio();break;
    case 'bioOff':disableBio();break;
    case 'lockGo':tryPin();break;
    case 'lockBio':bioUnlock();break;
    case 'forgotPin':forgotPin();break;
    case 'loadDemo':if(confirm('Se agregarán movimientos de ejemplo para '+S.year+'. Podrás quitarlos después. ¿Continuar?'))loadDemo();break;
    case 'clearDemo':S.tx=S.tx.filter(t=>!t.demo);commit();toast('Datos de ejemplo eliminados');break;
    case 'wipe':if(confirm('Esto borra todos tus movimientos, billeteras y ajustes. ¿Seguro?')&&confirm('Última confirmación: no se puede deshacer.')){const y=S.year;S=DEFAULT();S.year=y;commit();toast('Todo se borró')}break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='yearSel'){S.year=+el.value;commit()}
  else if(el.id==='scopeSel'){UI.scope=el.value;render()}
  else if(el.id==='walletFilter'){UI.wallet=el.value;render()}
  else if(el.id==='setTheme'){S.theme=el.value;applyTheme();commit()}
  else if(el.id==='setCur'){S.currency=el.value;_nf=null;commit()}
  else if(el.dataset.scopeName!=null){renameScope(+el.dataset.scopeName,el.value)}
  else if(el.dataset.scopeBiz!=null){S.scopes[+el.dataset.scopeBiz].biz=el.checked;commit()}
  else if(el.dataset.cardField){const c=W(el.dataset.id);const f=el.dataset.cardField;
    if(f==='limit'){const v=parseAmt(el.value);c.limit=isFinite(v)?v:0}
    else{const v=parseInt(el.value);if(!(v>=1&&v<=31)){toast('Usa un día entre 1 y 31.');render();return}c[f]=v}
    commit();toast('Tarjeta actualizada')}
  else if(el.id==='importFile'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.wallets)||!Array.isArray(d.tx))throw 0;
      if(confirm('Se reemplazarán tus datos actuales por los del respaldo. ¿Continuar?')){S=normalize(d);_nf=null;applyTheme();commit();toast('Respaldo restaurado')}}catch(x){toast('El archivo no es un respaldo válido de GemaFinanzy.')}el.value=''};r.readAsText(el.files[0])}
  else if(el.id==='importCsvFile'&&el.files[0]){const r=new FileReader();r.onload=()=>{importCsvTx(r.result);el.value=''};r.readAsText(el.files[0],'utf-8')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('newCat-')){e.preventDefault();document.querySelector(`[data-act="addCat"][data-k="${e.target.id.slice(7)}"]`).click()}
  if(e.key==='Enter'&&e.target.id==='newScope'){e.preventDefault();document.querySelector('[data-act="addScope"]').click()}
  if(e.key==='Enter'&&$('#scrim').classList.contains('open')&&e.target.tagName==='INPUT'&&TX&&$('#fAmt')){e.preventDefault();saveTx()}
});
$('#themeBtn').addEventListener('click',()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=dark?'light':'dark';applyTheme();commit()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(S.theme==='auto'){applyTheme();renderTop()}});

/* ---------- inicio ---------- */
(function boot(){
  const logoSrc='data:image/png;base64,'+LOGO_B64;document.querySelectorAll('.brand-mark,#gateLogo,#lockLogo').forEach(im=>im.src=logoSrc);
  const local=loadLocal();if(local)S=normalize(local);
  applyTheme();render();setSync();
  $('#lockPin').addEventListener('input',()=>{const c=pinCfg();if(c&&$('#lockPin').value.length===c.len)tryPin()});
  $('#lockPin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryPin()}});
  if(pinCfg())showLock();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!CLOUD)return;
  const a=readAuth();
  if(a&&a.ok&&a.user){store.user=a.user;store.token=a.token;store.exp=a.exp||0;setSync();startSession()}
  else{
    showGate('Cargando inicio de sesión…',true);
    whenGsi().then(ok=>{
      if(!ok)return showGate('No se pudo cargar el inicio de sesión de Google. Revisa tu conexión y recarga.');
      initGsi();showGate('');
    });
  }
})();
